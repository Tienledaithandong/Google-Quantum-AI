name: CLI contract
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cli-contract.yml
      - manifests/kaggle-cli.lock
      - scripts/check_cli_help.sh
permissions:
  contents: read
jobs:
  cli-help:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned CLI and inspect its argument parser
        run: |
          python3 -m venv "$RUNNER_TEMP/kaggle-cli"
          source "$RUNNER_TEMP/kaggle-cli/bin/activate"
          python -m pip install --only-binary=:all: --no-deps -r manifests/kaggle-cli.lock
          python -m pip check
          bash scripts/check_cli_help.sh
